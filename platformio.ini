; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; "pio run" compila los dos firmwares. Subir uno: pio run -e gateway -t upload (o -e nodo)
default_envs = gateway, nodo

; Común a los dos equipos (ESP32 DevKit + LoRa SX1262)
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Genera include/lora_key.h (clave del enlace LoRa) si no existe; los dos la comparten
extra_scripts = pre:scripts/lora_key.py

; Cada firmware compila su carpeta de src/ más src/lora/, que es la parte compartida.

; Gateway: Wi-Fi + servidor (MQTT) + LoRa. Va donde hay Wi-Fi
[env:gateway]
build_src_filter = -<*> +<lora/> +<gateway/>
; 1,9 MB por app (en vez de 1,25 MB) manteniendo las dos particiones para OTA.
; NVS queda en el mismo lugar (0x9000): la configuración y la vinculación se conservan.
board_build.partitions = min_spiffs.csv
lib_deps =
  bblanchon/ArduinoJson@^7.2.0
  tzapu/WiFiManager@^2.0.17
  jgromes/RadioLib@^7.4.0

; Nodo: LoRa + relé del motor, sin Wi-Fi. Va junto al motor
[env:nodo]
build_src_filter = -<*> +<lora/> +<nodo/>
lib_deps =
  jgromes/RadioLib@^7.4.0
